[build-system]
requires = ["maturin>=1.6,<2"]
build-backend = "maturin"

[project]
name = "datafusion-extra-functions"
dynamic = ["version"]
description = "datafusion-extra-functions (mode, skewness, kurtosis, max_by, min_by) for datafusion-python, via the DataFusion FFI PyCapsule protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# The FFI ABI is tied to the datafusion major it was compiled against;
# a mismatch segfaults, so the resolver must enforce the match.
dependencies = ["datafusion>=55,<56"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Repository = "https://github.com/datafusion-contrib/datafusion-extra-functions"

[tool.maturin]
module-name = "datafusion_extra_functions"
manifest-path = "Cargo.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
tests = ["pytest>=8"]
