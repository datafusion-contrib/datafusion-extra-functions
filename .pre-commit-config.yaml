fail_fast: true

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
  - id: check-toml
  - id: end-of-file-fixer
  - id: trailing-whitespace
  - id: check-added-large-files

- repo: local
  hooks:
  - id: format
    name: Format
    entry: cargo fmt --all
    types: [rust]
    language: system
    pass_filenames: false
  - id: clippy
    name: Clippy
    entry: cargo clippy -p datafusion-extra-functions --all-targets --all-features -- -D warnings
    types: [rust]
    language: system
    pass_filenames: false
  - id: test
    name: Test
    entry: cargo test
    types: [rust]
    language: system
    pass_filenames: false
